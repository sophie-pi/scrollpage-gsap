<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spielkarten - Alice in Borderland</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100vh;
            position: relative;
            background: radial-gradient(circle at center, #1a0000 0%, #000 100%);
        }

        .title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            letter-spacing: 10px;
            z-index: 10;
            text-align: center;
        }

        .instructions {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: #ff6b6b;
            text-align: center;
            z-index: 10;
            letter-spacing: 2px;
        }

        .card-info {
            position: absolute;
            top: 150px;
            right: 50px;
            background: linear-gradient(135deg, rgba(10, 0, 0, 0.9), rgba(26, 0, 0, 0.9));
            border: 2px solid #ff0000;
            border-radius: 15px;
            padding: 30px;
            max-width: 350px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 10;
        }

        .card-info.visible {
            opacity: 1;
        }

        .card-info h2 {
            color: #ff0000;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ff0000;
        }

        .card-info .difficulty {
            color: #ff6b6b;
            font-size: 1.2rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .card-info p {
            color: #ccc;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Laser Effects */
        .laser {
            position: absolute;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #ff0000, transparent);
            box-shadow: 0 0 10px #ff0000;
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }

        .laser-h {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
            box-shadow: 0 0 10px #ff0000;
            opacity: 0.4;
            pointer-events: none;
            z-index: 1;
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .card-info {
                right: 20px;
                left: 20px;
                max-width: none;
            }
            
            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="grid-overlay"></div>
        <div class="laser" style="left: 20%; animation: laserMove 4s ease-in-out infinite;"></div>
        <div class="laser" style="left: 50%; animation: laserMove 5s ease-in-out infinite 1s;"></div>
        <div class="laser" style="left: 80%; animation: laserMove 6s ease-in-out infinite 2s;"></div>
        <div class="laser-h" style="top: 30%; animation: laserMoveH 5s ease-in-out infinite;"></div>
        <div class="laser-h" style="top: 70%; animation: laserMoveH 6s ease-in-out infinite 1.5s;"></div>
        
        <h1 class="title">ALICE IN BORDERLAND CARDS</h1>
        <p class="instructions">BEWEGE MAUS • KLICKE AUF KARTEN</p>
        
        <div class="card-info" id="cardInfo">
            <h2 id="cardTitle">Wähle eine Karte</h2>
            <div class="difficulty" id="cardDifficulty">Schwierigkeit: ?</div>
            <p id="cardDescription">Bewege die Maus über die Karten um mehr zu erfahren.</p>
        </div>
    </div>

    <style>
        @keyframes laserMove {
            0%, 100% { transform: translateX(-50px); opacity: 0.2; }
            50% { transform: translateX(50px); opacity: 0.6; }
        }

        @keyframes laserMoveH {
            0%, 100% { transform: translateY(-50px); opacity: 0.2; }
            50% { transform: translateY(50px); opacity: 0.6; }
        }
    </style>

    <script>
        let scene, camera, renderer, cards = [];
        let mouse = { x: 0, y: 0 };
        let raycaster, intersects;
        let selectedCard = null;

        const cardData = {
            '3H': { name: '3 von Herz', difficulty: 3, suit: '♥', type: 'Vertrauen', color: 0xff0000,
                    desc: 'Ein Spiel des Vertrauens in einem brennenden Gebäude. Finde den sicheren Raum.' },
            '7H': { name: '7 von Herz', difficulty: 7, suit: '♥', type: 'Psychologie', color: 0xff0000,
                    desc: 'Das Wolfsrudel - Identifiziere den Wolf unter den Spielern bevor es zu spät ist.' },
            '10H': { name: '10 von Herz', difficulty: 10, suit: '♥', type: 'Verrat', color: 0xff0000,
                     desc: 'Hexenjagd - Finde die Hexe oder stirb durch falsche Anschuldigungen.' },
            'QH': { name: 'Dame von Herz', difficulty: 12, suit: '♥', type: 'Isolation', color: 0xff0000,
                    desc: 'Solitär in völliger Einsamkeit. Überwinde deine Ängste oder verliere deinen Verstand.' },
            '5S': { name: '5 von Pik', difficulty: 5, suit: '♠', type: 'Kraft', color: 0x000000,
                    desc: 'Durchquere die Arena. Körperliche Stärke und Geschwindigkeit entscheiden.' },
            'KS': { name: 'König von Pik', difficulty: 13, suit: '♠', type: 'Boss Fight', color: 0x000000,
                    desc: 'Die ultimative physische Herausforderung. Besiege den König oder stirb.' },
            '7D': { name: '7 von Karo', difficulty: 7, suit: '♦', type: 'Intelligenz', color: 0xff0000,
                    desc: 'Löse komplexe Rätsel unter Zeitdruck. Nur die Klügsten überleben.' },
            '3C': { name: '3 von Kreuz', difficulty: 3, suit: '♣', type: 'Teamwork', color: 0x000000,
                    desc: 'Arbeitet zusammen oder sterbt getrennt. Kommunikation ist der Schlüssel.' }
        };

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;
            camera.position.y = 2;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            raycaster = new THREE.Raycaster();

            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x404040, 1);
            scene.add(ambientLight);

            // Red spotlight
            const spotLight = new THREE.SpotLight(0xff0000, 2);
            spotLight.position.set(0, 20, 10);
            spotLight.castShadow = true;
            scene.add(spotLight);

            // Point lights
            const pointLight1 = new THREE.PointLight(0xff0000, 1, 50);
            pointLight1.position.set(-10, 5, 5);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff0000, 1, 50);
            pointLight2.position.set(10, 5, 5);
            scene.add(pointLight2);

            createCards();
            createParticles();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);

            animate();
        }

        function createCards() {
            const cardKeys = Object.keys(cardData);
            const radius = 8;
            const angleStep = (Math.PI * 2) / cardKeys.length;

            cardKeys.forEach((key, index) => {
                const angle = angleStep * index;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                const cardGroup = new THREE.Group();
                
                // Card geometry
                const geometry = new THREE.BoxGeometry(2, 3, 0.05);
                
                // Front material
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 384;
                const ctx = canvas.getContext('2d');
                
                // Card background
                const gradient = ctx.createLinearGradient(0, 0, 256, 384);
                gradient.addColorStop(0, '#1a1a1a');
                gradient.addColorStop(1, '#0a0a0a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 256, 384);
                
                // Border
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 4;
                ctx.strokeRect(4, 4, 248, 376);
                
                // Suit symbol
                ctx.font = 'bold 120px Arial';
                ctx.fillStyle = cardData[key].color === 0xff0000 ? '#ff0000' : '#fff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cardData[key].suit, 128, 140);
                
                // Value
                ctx.font = 'bold 80px Arial';
                ctx.fillStyle = '#ff0000';
                ctx.fillText(key.replace('H', '').replace('S', '').replace('D', '').replace('C', ''), 128, 260);
                
                // Type
                ctx.font = 'bold 20px Arial';
                ctx.fillStyle = '#ff6b6b';
                ctx.fillText(cardData[key].type.toUpperCase(), 128, 340);
                
                const texture = new THREE.CanvasTexture(canvas);
                const frontMaterial = new THREE.MeshPhongMaterial({ 
                    map: texture,
                    shininess: 100,
                    emissive: 0x330000,
                    emissiveIntensity: 0.2
                });
                
                // Back material
                const backMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x0a0a0a,
                    shininess: 100,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.1
                });
                
                // Side materials
                const sideMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xff0000,
                    emissive: 0xff0000,
                    emissiveIntensity: 0.3
                });
                
                const materials = [
                    sideMaterial, // right
                    sideMaterial, // left
                    sideMaterial, // top
                    sideMaterial, // bottom
                    frontMaterial, // front
                    backMaterial  // back
                ];
                
                const card = new THREE.Mesh(geometry, materials);
                
                // Glow effect
                const glowGeometry = new THREE.BoxGeometry(2.1, 3.1, 0.06);
                const glowMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xff0000,
                    transparent: true,
                    opacity: 0.3,
                    side: THREE.BackSide
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                cardGroup.add(glow);
                
                cardGroup.add(card);
                cardGroup.position.set(x, 0, z);
                cardGroup.lookAt(0, 0, 0);
                cardGroup.userData = { key: key, data: cardData[key], originalY: 0, card: card, glow: glow };
                
                scene.add(cardGroup);
                cards.push(cardGroup);
                
                // Initial animation
                gsap.from(cardGroup.position, {
                    y: -10,
                    duration: 1.5,
                    delay: index * 0.1,
                    ease: "bounce.out"
                });
                
                gsap.from(cardGroup.rotation, {
                    y: cardGroup.rotation.y + Math.PI * 2,
                    duration: 1.5,
                    delay: index * 0.1,
                    ease: "power2.out"
                });
            });
        }

        function createParticles() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 1000;
            const posArray = new Float32Array(particlesCount * 3);

            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 50;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.05,
                color: 0xff0000,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // Animate particles
            function animateParticles() {
                const positions = particlesGeometry.attributes.position.array;
                for(let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.01;
                    if(positions[i] < -25) {
                        positions[i] = 25;
                    }
                }
                particlesGeometry.attributes.position.needsUpdate = true;
            }

            setInterval(animateParticles, 16);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            intersects = raycaster.intersectObjects(cards, true);

            // Reset all cards
            cards.forEach(cardGroup => {
                gsap.to(cardGroup.position, {
                    y: cardGroup.userData.originalY,
                    duration: 0.3
                });
                gsap.to(cardGroup.scale, {
                    x: 1,
                    y: 1,
                    z: 1,
                    duration: 0.3
                });
                cardGroup.userData.glow.material.opacity = 0.3;
            });

            // Highlight hovered card
            if (intersects.length > 0) {
                let cardGroup = intersects[0].object.parent;
                gsap.to(cardGroup.position, {
                    y: 0.5,
                    duration: 0.3
                });
                gsap.to(cardGroup.scale, {
                    x: 1.2,
                    y: 1.2,
                    z: 1.2,
                    duration: 0.3
                });
                cardGroup.userData.glow.material.opacity = 0.8;

                // Update info panel
                const data = cardGroup.userData.data;
                document.getElementById('cardTitle').textContent = data.name;
                document.getElementById('cardDifficulty').textContent = `Schwierigkeit: ${data.difficulty} ${data.suit}`;
                document.getElementById('cardDescription').textContent = data.desc;
                document.getElementById('cardInfo').classList.add('visible');
            } else {
                document.getElementById('cardInfo').classList.remove('visible');
            }

            // Camera follow mouse
            camera.position.x += (mouse.x * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouse.y * 2 - camera.position.y + 2) * 0.05;
            camera.lookAt(scene.position);
        }

        function onMouseClick(event) {
            if (intersects && intersects.length > 0) {
                let cardGroup = intersects[0].object.parent;
                
                // Flip animation
                gsap.to(cardGroup.rotation, {
                    y: cardGroup.rotation.y + Math.PI,
                    duration: 0.6,
                    ease: "power2.inOut"
                });
                
                // Pulse effect
                gsap.to(cardGroup.userData.glow.material, {
                    opacity: 1,
                    duration: 0.2,
                    yoyo: true,
                    repeat: 3
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate cards slowly
            cards.forEach((cardGroup, index) => {
                cardGroup.rotation.y += 0.001;
            });

            // Rotate scene
            scene.rotation.y += 0.0005;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
